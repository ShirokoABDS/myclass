<style>
:root{
  --bg:#0d0f13; --surface:#151a21; --surface2:#1c222c; --chip:#1a202b;
  --text:#eef1f6; --muted:#98a2b3; --accent:#ff8a3d; --accent2:#ffb37e;
  --border:#262d39; --shadow:0 10px 30px rgba(0,0,0,.45);
  --hb:64px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceff3; --chip:#ffffff;
  --text:#181d26; --muted:#5f6b7a; --accent:#e06a12; --accent2:#ff8a3d;
  --border:#e2e6ec; --shadow:0 10px 30px rgba(20,30,50,.10);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);overflow-x:hidden;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.5;min-height:100vh;
}
body.lb-open{overflow:hidden}
svg.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-0.28em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:10px clamp(14px,4vw,28px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 0}
.brand-badge{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1c1208;
}
.brand-text{flex:1 1 0;min-width:0;overflow:hidden}
.brand h1{font-size:clamp(15px,2.2vw,18px);font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand p{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.actions{display:flex;gap:8px;flex:none}
.tool-btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;
  border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:13px;
  transition:background .3s var(--ease-out),border-color .3s var(--ease-out),color .3s,transform .35s var(--ease-spring);
}
.tool-btn:hover{border-color:var(--accent);color:var(--accent2)}
.tool-btn:active{transform:scale(.94)}
.tool-btn .ic{width:1.15em;height:1.15em}
html[data-theme="dark"] .ic-moon{display:none}
html[data-theme="light"] .ic-sun{display:none}
.thumb-btn{width:38px;padding:0;justify-content:center}

.filters{
  position:sticky;top:var(--hb);z-index:35;
  display:flex;flex-direction:column;gap:8px;
  padding:10px clamp(14px,4vw,28px) 12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.searchrow{display:flex;align-items:center;gap:10px}
.search{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;
  height:36px;padding:0 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--chip);color:var(--text);
  transition:border-color .3s var(--ease-out),background .3s var(--ease-out);
}
.search:focus-within{border-color:var(--accent)}
.search .ic{width:1.1em;height:1.1em;color:var(--muted)}
.search input{
  flex:1;min-width:0;border:0;background:transparent;color:inherit;
  font:inherit;font-size:13.5px;outline:none;
}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search-arch{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-right:2px}
.search .clr{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
}
.search .clr:hover{color:var(--text)}
.search .clr .ic{width:0.9em;height:0.9em}
.search .clr[hidden]{display:none}

main{padding:18px clamp(14px,4vw,28px) 40px}
.masonry{columns:2;column-gap:12px}
@media (min-width:640px){.masonry{columns:3}}
@media (min-width:1024px){.masonry{columns:4}}
@media (min-width:1440px){.masonry{columns:5}}
.card{
  position:relative;overflow:hidden;border-radius:14px;margin:0 0 12px;
  break-inside:avoid;cursor:zoom-in;background:var(--surface2);
  border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.15);
  animation:cardIn .6s var(--ease-out) both;
  animation-delay:var(--dly,0ms);
  transition:transform .35s var(--ease-spring),box-shadow .35s var(--ease-out),border-color .35s;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(26px) scale(.96)}
  60%{opacity:.85}
  to{opacity:1;transform:none}
}
@media (hover:hover){.card:hover{transform:translateY(-4px) scale(1.012);border-color:var(--accent);box-shadow:var(--shadow)}}
.card img{width:100%;height:auto;display:block;opacity:0}
.card img.ld{opacity:1;transition:opacity .5s var(--ease-out),transform .45s var(--ease-out)}
@media (hover:hover){.card:hover img.ld{transform:scale(1.045)}}
.num{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;
  background:rgba(10,12,16,.62);color:#fff;border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;
}
.card figcaption{
  position:absolute;inset-inline:0;bottom:0;padding:26px 12px 9px;
  background:linear-gradient(to top,rgba(8,10,14,.72),transparent);
  color:#fff;font-size:11.5px;display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity .25s var(--ease-out);
}
.card:hover figcaption,.card:focus-visible figcaption{opacity:1}

.empty{
  padding:70px 16px;text-align:center;color:var(--muted);font-size:14px;
}
.empty .ic{width:40px;height:40px;stroke-width:1.5;color:var(--muted);display:block;margin:0 auto 12px}

#backTop{
  position:fixed;right:18px;bottom:18px;z-index:38;width:42px;height:42px;
  border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(10px) scale(.9);
  transition:opacity .3s var(--ease-out),transform .4s var(--ease-spring),visibility .3s,border-color .3s;
}
#backTop.show{opacity:1;visibility:visible;transform:none}
#backTop:hover{border-color:var(--accent);color:var(--accent2)}

#toast{
  position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,20px);
  max-width:min(92vw,560px);padding:11px 18px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  box-shadow:var(--shadow);font-size:13px;line-height:1.7;text-align:center;
  opacity:0;visibility:hidden;
  transition:opacity .35s var(--ease-out),transform .45s var(--ease-spring),visibility .35s;
}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

.footer{
  padding:22px clamp(14px,4vw,28px) 30px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12px;line-height:1.9;
}

.lightbox{
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:rgba(7,9,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;
  transition:opacity .3s var(--ease-out),visibility .3s;
}
.lightbox.open{opacity:1;visibility:visible}
.lightbox[hidden]{display:none}
.lb-stage{flex:1;display:grid;place-items:center;min-height:0;padding:8px}
@keyframes lbGrow{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes lbSwap{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.lb-media{
  max-width:96vw;max-height:80vh;width:auto;height:auto;object-fit:contain;
  border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.5);
  animation:lbGrow .45s var(--ease-out) both;
}
@media (prefers-reduced-motion:no-preference){
  .lb-media.swap{animation:lbSwap .3s var(--ease-out) both}
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:62;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,22,29,.72);border:1px solid rgba(255,255,255,.14);color:#fff;
  transition:background .3s var(--ease-out),transform .4s var(--ease-spring);
}
.lb-nav:hover{background:var(--accent);color:#211405;transform:translateY(-50%) scale(1.1)}
.lb-nav:active{transform:translateY(-50%) scale(.94)}
.lb-nav.prev{left:14px}.lb-nav.next{right:14px}
.lb-close{position:absolute;top:14px;right:14px;z-index:62}
.lb-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,22,29,.72);border:1px solid rgba(255,255,255,.14);color:#fff;
  transition:background .3s var(--ease-out),transform .4s var(--ease-spring);
}
.lb-btn:hover{background:var(--accent);color:#211405;transform:scale(1.08)}
.lb-btn:active{transform:scale(.94)}
.lb-bar{
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));color:#cfd6e2;font-size:13px;
}
.lb-num{font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.lb-time{display:inline-flex;align-items:center;gap:7px}
.lb-time .ic{width:1.1em;height:1.1em}
.lb-count{font-variant-numeric:tabular-nums;opacity:.75}
#lbDownload{color:#cfd6e2;text-decoration:none}
#lbDownload:hover{background:var(--accent);color:#211405}

@media (max-width:520px){
  :root{--hb:56px}
  .brand-badge{width:34px;height:34px}
  .brand h1{font-size:14px}
  .brand p{font-size:11px}
  .actions{gap:6px}
  .tool-btn{width:36px;padding:0;justify-content:center}
  #sortBtn{width:36px;gap:0;padding:0}
  #sortBtn span{display:none}
  .lb-nav{width:40px;height:40px}
  .lb-nav.prev{left:8px}.lb-nav.next{right:8px}
  .lb-media{max-height:76vh}
  .lb-bar{gap:10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}

  });

  $('lbClose').addEventListener('click', lbCloseFn);
  $('lbPrev').addEventListener('click', function () { lbStep(-1); });
  $('lbNext').addEventListener('click', function () { lbStep(1); });
  stage.addEventListener('click', function (e) {
    if (e.target === stage) lbCloseFn();
  });
  lb.addEventListener('click', function (e) {
    if (e.target === lb) lbCloseFn();
  });

  document.addEventListener('keydown', function (e) {
    if (!lbOpenState) return;
    if (e.key === 'Escape') lbCloseFn();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
  });

  var tsX = 0, tsY = 0;
  lb.addEventListener('touchstart', function (e) {
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.6) lbStep(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---- init ---- */
  $('subtitle').textContent = PG + ' · ' + items.length + ' 张照片 · 按文件名首字母排序';
  renderSort();
  renderGrid();
})();
</script>
</body>
</html>
